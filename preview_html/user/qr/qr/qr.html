	<div id="modalcreate" class="modal">
		<form action="../../../front">
			<input type="hidden" name="storeId" value="">
			<input type="hidden" value="createTable" name="methodName">
			<input type="hidden" value="user" name="key">
			
			<div class="formDiv">
				<label for="tableNo">테이블 이름 : </label>
				<input type="text" name="tableNo" id="tableNo">
			</div>
			
			<button>테이블 추가</button>
		</form>
	</div>
	
    <div id="background">
    	<div id="header">
    		<button onclick="location.href='../../../front?key=user&methodName=logout'" id="logOut" class="selectBtn">로그아웃</button>
    	</div>

	    	<button onclick="location.href='../../../front?key=user&methodName=selectAllMenu'" id="menu" class="selectBtn">메뉴</button>

	    </div>

		<div id="subselect">

				<button id="create" class="modalBtn selectBtn">추가</button>

		</div>
	    <div id="list">

			  		<div id="modal" class="qrDiv">
			  			<img alt="" src="">

			</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var qrs = [
    {no:'1번 테이블', id:1},
    {no:'2번 테이블', id:2},
    {no:'3번 테이블', id:3},
    {no:'VIP 룸',     id:4},
  ];
  var container = document.getElementById('qrMain');
  if (!container) return;
  qrs.forEach(function(q) {
    var url = 'http://localhost:8888/index.html?table='+q.id;
    var div = document.createElement('div');
    div.className = 'qrDiv';
    div.innerHTML =
      '<img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(url)+'" alt="QR">'+
      '<p>'+q.no+'</p>';
    container.appendChild(div);
  });
});
</script>
